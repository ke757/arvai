# Arvai Kernel Server Configuration
# 此文件中的配置项会在启动时自动注入到环境变量

server:
  host: "127.0.0.1"
  port: 8731
  debug: false
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:1420"   # Tauri dev
    - "chrome-extension://*"

database:
  path: "./data/arvai.db"

app:
  name: "Arvai Kernel"
  version: "0.1.0"

llm:
  active_provider: ""    # openai / deepseek / qianwen / ollama
  providers:
    openai:
      model: "gpt-4o-mini"
      api_key: ""
    deepseek:
      model: "deepseek-chat"
      api_key: ""
      base_url: "https://api.deepseek.com/v1"
    qianwen:
      model: "qwen-turbo"
      api_key: ""
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    ollama:
      model: "llama3"
      base_url: "http://localhost:11434"
